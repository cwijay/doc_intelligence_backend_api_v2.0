# ===========================================
# Google Cloud Build Configuration
# Document Intelligence API - Cloud Run Deployment
# ===========================================

steps:
  # Step 1: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--platform', 'linux/amd64',
      '-t', 'gcr.io/$PROJECT_ID/document-intelligence-api:auth-fix-v1',
      '-t', 'gcr.io/$PROJECT_ID/document-intelligence-api:latest',
      '.'
    ]
    dir: '.'

  # Step 2: Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/document-intelligence-api:auth-fix-v1']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/document-intelligence-api:latest']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'document-intelligence-api'
      - '--image=gcr.io/$PROJECT_ID/document-intelligence-api:auth-fix-v1'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--concurrency=${_CONCURRENCY}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--timeout=${_TIMEOUT}'
      - '--update-env-vars=ENVIRONMENT=production,FIREBASE_PROJECT_ID=ibm-keras,FIREBASE_DATABASE_ID=biz-to-bricks-store,GCP_PROJECT_ID=ibm-keras,GOOGLE_CLOUD_PROJECT=ibm-keras,LOG_LEVEL=INFO,LOG_FORMAT=json,GCS_BUCKET_NAME=biz-to-bricks-document-store,JWT_SECRET_KEY=your-256-bit-production-secret-key-change-this,PRODUCTION_CORS_ORIGINS=["http://localhost:3000","https://document-intelligence-frontend-yawfj7f47q-uc.a.run.app"],FRONTEND_DOMAIN=biztobricks.com'

# Substitution variables (can be overridden)
substitutions:
  _REGION: 'us-central1'
  _MEMORY: '1Gi'
  _CPU: '1'
  _CONCURRENCY: '80'
  _MAX_INSTANCES: '10'
  _TIMEOUT: '300'

# Override substitutions for different environments
# Example: gcloud builds submit --substitutions=_FRONTEND_DOMAIN=myapp.com,_PRODUCTION_CORS_ORIGINS='["https://myapp.com"]'

# Build options
options:
  # Use Cloud Logging for better integration
  logging: CLOUD_LOGGING_ONLY
  
  # Use higher CPU for faster builds
  machineType: 'E2_HIGHCPU_8'
  
  # Increase disk size for Docker builds
  diskSizeGb: '100'

# Build timeout (30 minutes)
timeout: '1800s'

# Build artifacts
images:
  - 'gcr.io/$PROJECT_ID/document-intelligence-api:auth-fix-v1'
  - 'gcr.io/$PROJECT_ID/document-intelligence-api:latest'