# ===========================================
# Google Cloud Build Configuration
# Document Intelligence API - Cloud Run Deployment
# ===========================================
#
# Simple manual deployment configuration for Cloud Build
# Usage: gcloud builds submit --config cloudbuild.yaml
#
# For more control, use the bash deployment script:
#   ./deploy_full.sh --project-id PROJECT_ID --env-file .env.production

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'

steps:
  # Step 1: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '.'

  # Step 2: Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--concurrency=${_CONCURRENCY}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--timeout=60'
      - '--port=8080'
      - '--update-env-vars=ENVIRONMENT=${_ENVIRONMENT},FIREBASE_PROJECT_ID=${_GCP_PROJECT_ID},FIREBASE_DATABASE_ID=${_FIREBASE_DATABASE_ID},GCP_PROJECT_ID=${_GCP_PROJECT_ID},LOG_LEVEL=${_LOG_LEVEL},LOG_FORMAT=json,GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},FRONTEND_DOMAIN=${_FRONTEND_DOMAIN},PRODUCTION_CORS_ORIGINS=${_PRODUCTION_CORS_ORIGINS}'
      - '--service-account=${_SERVICE_ACCOUNT}'

# Substitution variables (can be overridden via --substitutions)
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'document-intelligence-api'
  _ENVIRONMENT: 'production'
  _GCP_PROJECT_ID: 'biz2bricks-dev-v1'
  _FIREBASE_DATABASE_ID: 'biz2bricks-dev-v1-docdb-v1'
  _GCS_BUCKET_NAME: 'biz2bricks-dev-v1-document-store'
  _FRONTEND_DOMAIN: 'biztobricks.com'
  _PRODUCTION_CORS_ORIGINS: '["https://biztobricks.com","https://www.biztobricks.com"]'
  _SERVICE_ACCOUNT: '727735128283-compute@developer.gserviceaccount.com'
  _LOG_LEVEL: 'INFO'
  _MEMORY: '1Gi'
  _CPU: '1'
  _CONCURRENCY: '80'
  _MAX_INSTANCES: '10'

# Build artifacts
images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

# Tags for build organization
tags:
  - 'biz2bricks-dev-v1-api'
  - 'cloud-run-deployment'

# Note: This configuration does NOT include API keys (JWT_SECRET_KEY, OPENAI_API_KEY, etc.)
# For deployments requiring API keys, use one of these methods:
#   1. Bash script: ./deploy_full.sh --project-id PROJECT_ID --env-file .env.production
#   2. Manual gcloud: Add --update-env-vars with your API keys
#   3. Cloud Console: Update environment variables in Cloud Run service settings
