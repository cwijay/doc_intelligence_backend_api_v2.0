# =============================================================================
# Cloud Build: Document Intelligence Backend API
# =============================================================================
# Automated CI/CD pipeline for Cloud Run deployment with GitHub integration.
#
# Triggers:
#   - develop branch → dev environment
#   - master branch → prod environment
#
# Manual deployment:
#   gcloud builds submit --config cloudbuild.yaml
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_ENV=prod,_SECRET_SUFFIX=-prod
#
# Timeline: ~15-20 minutes. Slower than the previous ~5-7 because builds now
# run on the default pool machine type to stay inside the free build tier.
# The 1800s timeout below leaves ample headroom.
# =============================================================================

options:
  # No machineType: naming one opts the build OUT of the 2,500 free
  # build-minutes/month, which only apply to the default pool's default
  # machine type. Builds are slower than on E2_HIGHCPU_8 but free.
  # diskSizeGb is likewise omitted to take the default.
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'

timeout: '1800s'

steps:
  # Step 1: Run automated tests
  # - Development: smoke tests only (fast)
  # - Production: full test suite
  - name: 'python:3.12-slim'
    id: 'run-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Installing UV package manager..."
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="/root/.cargo/bin:$$PATH"

        echo "Installing dependencies..."
        uv sync --frozen

        if [ "${_ENV}" = "prod" ]; then
          echo "Running full test suite (production)..."
          uv run pytest tests/ -v --asyncio-mode=auto --tb=short || exit 1
          echo "All production tests passed!"
        else
          echo "Running smoke tests (development)..."
          uv run pytest tests/ -v -m "smoke" --asyncio-mode=auto --tb=short || true
          echo "Smoke tests completed!"
        fi

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/document-intelligence/backend-api:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/document-intelligence/backend-api:${_ENV}-latest'
      - '.'
    waitFor: ['run-tests']

  # Step 3: Push all image tags to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/document-intelligence/backend-api'
    waitFor: ['build-image']

  # Step 4: Apply database migrations
  # Runs before the new revision serves traffic, so a failed migration aborts
  # the deploy instead of crash-looping Cloud Run. Schema is owned by Alembic;
  # the services no longer create tables on startup.
  #
  # ONE-TIME SETUP for a database that predates this step: it was built by
  # create_all and already holds every table, so it must be stamped once before
  # the first run, otherwise the baseline revision tries to create tables that
  # already exist:
  #     alembic stamp head
  #
  # The Cloud Build service account needs roles/cloudsql.client and
  # roles/secretmanager.secretAccessor.
  - name: 'python:3.12-slim'
    id: 'migrate-database'
    entrypoint: 'bash'
    secretEnv: ['DATABASE_PASSWORD']
    env:
      - 'USE_CLOUD_SQL_CONNECTOR=true'
      - 'CLOUD_SQL_IP_TYPE=PUBLIC'
      - 'CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE}'
      - 'DATABASE_NAME=${_DATABASE_NAME}'
      - 'DATABASE_USER=${_DATABASE_USER}'
    args:
      - '-c'
      - |
        set -euo pipefail

        apt-get update -qq && apt-get install -y -qq git > /dev/null

        # Migrations live in the biz2bricks_core repository, not in its wheel,
        # so check out exactly the revision this image pins. That keeps the
        # schema in step with the code that will run against it.
        CORE_REV=$$(grep -A2 'name = "biz2bricks-core"' uv.lock \
          | grep 'source = ' | sed -E 's/.*#([0-9a-f]{40}).*/\1/')
        if [ -z "$$CORE_REV" ]; then
          echo "Could not read the biz2bricks-core revision from uv.lock"
          exit 1
        fi
        echo "biz2bricks-core revision pinned by uv.lock: $$CORE_REV"

        git clone --quiet https://github.com/cwijay/biz_to_bricks_core_v1.git /workspace/core
        cd /workspace/core
        git checkout --quiet "$$CORE_REV"

        pip install --quiet --root-user-action=ignore ".[migrations,pgvector]"

        echo "Revision before migrating:"
        alembic current
        alembic upgrade head
        echo "Revision after migrating:"
        alembic current

        echo "Migrations applied."
    waitFor: ['push-image']

  # Step 5: Deploy to Cloud Run (immediate 100% traffic)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-to-cloudrun'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Deploying to Cloud Run (${_ENV})..."

        gcloud run deploy ${_SERVICE_NAME} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/document-intelligence/backend-api:$BUILD_ID \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --memory=${_MEMORY} \
          --cpu=${_CPU} \
          --concurrency=${_CONCURRENCY} \
          --max-instances=${_MAX_INSTANCES} \
          --timeout=60 \
          --port=8080 \
          --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE} \
          --update-env-vars=ENVIRONMENT=${_ENV},GCP_PROJECT_ID=$PROJECT_ID,LOG_LEVEL=${_LOG_LEVEL},LOG_FORMAT=json,GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},FRONTEND_DOMAIN=${_FRONTEND_DOMAIN},MAX_FILE_SIZE=${_MAX_FILE_SIZE},CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE},USE_CLOUD_SQL_CONNECTOR=true,CLOUD_SQL_IP_TYPE=PUBLIC,DATABASE_NAME=${_DATABASE_NAME},DATABASE_USER=${_DATABASE_USER},AI_API_URL=${_AI_API_URL} \
          --remove-env-vars=PRODUCTION_CORS_ORIGINS,ALLOWED_FILE_TYPES \
          --update-secrets=JWT_SECRET_KEY=JWT_SECRET_KEY${_SECRET_SUFFIX}:latest,DATABASE_PASSWORD=DATABASE_PASSWORD${_SECRET_SUFFIX}:latest \
          || exit 1

        echo "Deployment successful!"
    waitFor: ['migrate-database']

  # Step 6: Health check
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'health-check'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Running health checks..."

        # Get service URL
        SERVICE_URL=$$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format="value(status.url)")
        echo "Service URL: $$SERVICE_URL"

        # Wait for service to be ready
        echo "Waiting 15 seconds for service to initialize..."
        sleep 15

        # Test health endpoint
        echo "Testing /health endpoint..."
        HTTP_STATUS=$$(curl -s -o /dev/null -w "%{http_code}" "$$SERVICE_URL/health")
        if [ "$$HTTP_STATUS" -eq 200 ]; then
          echo "Health check passed! (HTTP $$HTTP_STATUS)"
        else
          echo "Health check failed! (HTTP $$HTTP_STATUS)"
          exit 1
        fi

        # Test status endpoint
        echo "Testing /status endpoint..."
        HTTP_STATUS=$$(curl -s -o /dev/null -w "%{http_code}" "$$SERVICE_URL/status")
        if [ "$$HTTP_STATUS" -eq 200 ]; then
          echo "Status check passed! (HTTP $$HTTP_STATUS)"
        else
          echo "Status check failed! (HTTP $$HTTP_STATUS)"
          exit 1
        fi

        echo ""
        echo "Health checks passed!"
        echo "Deployment complete!"
        echo "Environment: ${_ENV}"
        echo "Service URL: $$SERVICE_URL"
    waitFor: ['deploy-to-cloudrun']

# Secrets exposed to build steps (the migration step needs the DB password)
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_PASSWORD${_SECRET_SUFFIX}/versions/latest
      env: 'DATABASE_PASSWORD'

# Substitution variables
# Override these via Cloud Build triggers or --substitutions flag
substitutions:
  # Core settings
  _ENV: 'dev'
  _REGION: 'us-central1'
  _SERVICE_NAME: 'document-intelligence-api-dev'
  _SECRET_SUFFIX: ''  # Empty for dev, '-prod' for production

  # GCP settings
  _GCS_BUCKET_NAME: 'biz2bricks-dev-v1-document-store'

  # AI service - used to de-index documents from Gemini File Search on delete.
  # Deletion here is a soft delete, so without this the document stays searchable.
  _AI_API_URL: 'https://document-intelligence-ai-api-dev-tfibpeg5zq-uc.a.run.app'

  # Cloud SQL settings
  _CLOUD_SQL_INSTANCE: 'biz2bricks-dev-v1:us-central1:doc-intelligence-db'
  _DATABASE_NAME: 'doc_intelligence'
  _DATABASE_USER: 'postgres'

  # CORS and domains
  _FRONTEND_DOMAIN: 'dev.biztobricks.com'
  _PRODUCTION_CORS_ORIGINS: '["https://dev.biztobricks.com","http://localhost:3000"]'

  # Resource limits
  _LOG_LEVEL: 'DEBUG'
  _MEMORY: '1Gi'
  _CPU: '1'
  _CONCURRENCY: '80'
  _MAX_INSTANCES: '5'

  # Application settings
  _MAX_FILE_SIZE: '52428800'
  _ALLOWED_FILE_TYPES: '["pdf", "xlsx", "xls", "csv"]'

# Store built images in Artifact Registry
# ':latest' is deliberately not built or pushed: dev and prod builds both
# wrote to it, so it was an ambiguous pointer. Use ':${_ENV}-latest'.
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/document-intelligence/backend-api:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/document-intelligence/backend-api:${_ENV}-latest'

# Tags for build organization
tags:
  - 'backend-api'
  - '${_ENV}'

# =============================================================================
# Trigger Configuration Reference
# =============================================================================
#
# Development Trigger (develop branch):
#   Name: backend-api-dev-deploy
#   Branch: ^develop$
#   Substitutions: (use defaults)
#
# Production Trigger (master branch):
#   Name: backend-api-prod-deploy
#   Branch: ^master$
#   Substitutions:
#     _ENV: prod
#     _SERVICE_NAME: document-intelligence-api-prod
#     _SECRET_SUFFIX: -prod
#     _LOG_LEVEL: INFO
#     _MAX_INSTANCES: 10
#     _FRONTEND_DOMAIN: biztobricks.com
#     _PRODUCTION_CORS_ORIGINS: ["https://biztobricks.com","https://www.biztobricks.com"]
#
# =============================================================================
