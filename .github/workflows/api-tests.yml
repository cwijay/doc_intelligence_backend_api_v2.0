name: API Tests

on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Run API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ['3.12']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify uv installation
        run: |
          uv --version

      - name: Install dependencies
        run: |
          uv sync

      - name: Run linting
        run: |
          uv run ruff check app/ tests/ || true
        continue-on-error: true

      - name: Run type checking
        run: |
          uv run mypy app/ || true
        continue-on-error: true

      - name: Run tests (skip AI and slow tests)
        env:
          TEST_BASE_URL: ${{ secrets.TEST_BASE_URL || 'http://localhost:8000' }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_ID: ${{ secrets.FIREBASE_DATABASE_ID }}
          TEST_CLEANUP_ON_FAILURE: 'True'
          TEST_LOG_LEVEL: INFO
        run: |
          # Run tests excluding AI tests (to avoid OpenAI API costs) and slow tests
          uv run pytest tests/ -v \
            -m "not ai and not slow" \
            --tb=short \
            --maxfail=5 \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=pytest-report.xml
        continue-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            pytest-report.xml
            tests/test.log
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-py${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Test Summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: pytest-report.xml

  test-cloud-run:
    name: Test Against Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync

      - name: Run tests against Cloud Run (skip AI tests)
        env:
          TEST_BASE_URL: ${{ secrets.CLOUD_RUN_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_ID: ${{ secrets.FIREBASE_DATABASE_ID }}
          TEST_CLEANUP_ON_FAILURE: 'True'
        run: |
          # Run tests against deployed Cloud Run instance
          # Skip AI tests to avoid costs, but include integration tests
          uv run pytest tests/ -v \
            -m "not ai and not slow" \
            --tb=short \
            --maxfail=3
        continue-on-error: false

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Cloud Run tests failed. Check the deployment."

  test-with-ai:
    name: Run AI Tests (Manual Only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync

      - name: Run AI tests
        env:
          TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_ID: ${{ secrets.FIREBASE_DATABASE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLAMAPARSE_API_KEY: ${{ secrets.LLAMAPARSE_API_KEY }}
          TEST_CLEANUP_ON_FAILURE: 'True'
        run: |
          # Run only AI tests (these cost money via OpenAI API)
          uv run pytest tests/ -v \
            -m "ai" \
            --tb=short \
            --maxfail=3

      - name: Upload AI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-test-results
          path: |
            pytest-report.xml
            tests/test.log
          retention-days: 30
