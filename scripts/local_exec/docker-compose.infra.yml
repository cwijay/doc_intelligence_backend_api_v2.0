# Local development infrastructure for the Document Intelligence backend API.
#
# Deliberately self-contained: this file owns its own compose project, its own
# volumes and its own host ports, so it never collides with the full-platform
# stack in ../biz2bricks_stack or with unrelated projects on the same Docker
# daemon. Start it with ./setup_infra.sh, not `docker compose up` directly —
# the script also creates the schema the API needs to boot.

name: b2blocal

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: b2blocal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - run setup_infra.sh}
      POSTGRES_DB: ${DATABASE_NAME:-doc_intelligence}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback only. 15432 rather than 5432 because other projects on this
      # machine commonly hold the default port.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-doc_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: b2blocal-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    ports:
      # 16379 rather than 6379 for the same reason as Postgres above. The API
      # runs on the host here, so unlike the containerised stack it does need
      # a published port.
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  default:
    # Explicit subnet: Docker's default address pools are easily exhausted on a
    # machine running several compose projects, and the failure mode is an
    # opaque "all predefined address pools have been fully subnetted" on
    # `up`. Chosen to avoid both the exhausted 172.16-172.31 defaults and the
    # 10.55.0.0/24 used by ../biz2bricks_stack.
    ipam:
      config:
        - subnet: 10.56.0.0/24

volumes:
  pgdata:
  redisdata:
