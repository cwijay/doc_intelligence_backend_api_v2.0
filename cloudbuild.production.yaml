# ===========================================
# Cloud Build Configuration - Production (Master Branch)
# Manual approval required + Gradual traffic rollout
# ===========================================
#
# Triggered by: Push to 'master' branch
# Deploys to: document-intelligence-api (production)
# Timeline: ~15-20 minutes
# Approval: REQUIRED via Cloud Console
#
# Pipeline Steps:
# 1. Run comprehensive tests (pytest)
# 2. Build production Docker image
# 3. Push to Google Container Registry
# 4. Deploy new revision WITHOUT traffic
# 5. Run smoke tests on candidate revision
# 6. Gradual rollout: 10% → 50% → 100% traffic
#
# Rollout Strategy:
# - New revision deployed with tag "candidate-{SHORT_SHA}"
# - No traffic initially (--no-traffic flag)
# - Smoke tests run on tagged URL
# - Gradual migration: 10% (2 min) → 50% (2 min) → 100%
#

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'

timeout: '2400s'

# Load production secrets from Secret Manager (with -prod suffix)
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/JWT_SECRET_KEY-prod/versions/latest
      env: JWT_SECRET_KEY
    - versionName: projects/$PROJECT_ID/secrets/OPENAI_API_KEY-prod/versions/latest
      env: OPENAI_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/LLAMAPARSE_API_KEY-prod/versions/latest
      env: LLAMAPARSE_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/PINECONE_API_KEY-prod/versions/latest
      env: PINECONE_API_KEY

steps:
  # Step 1: Run comprehensive pre-deployment tests
  - name: 'python:3.12-slim'
    id: 'run-production-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🧪 Running comprehensive production tests..."
        echo "Installing UV package manager..."
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="/root/.cargo/bin:$PATH"

        echo "Installing dependencies..."
        uv sync --frozen

        echo "Running pytest with detailed output..."
        uv run pytest tests/ -v --asyncio-mode=auto --tb=short || exit 1

        echo "✅ All production tests passed!"

  # Step 2: Build production Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-production-image'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_ENVIRONMENT}-latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_ENVIRONMENT}-$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:production-$SHORT_SHA'
      - '.'
    waitFor: ['run-production-tests']

  # Step 3: Push all production image tags to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-production-image'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}'
    waitFor: ['build-production-image']

  # Step 4: Deploy new revision WITHOUT traffic (candidate revision)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-candidate-revision'
    entrypoint: 'bash'
    secretEnv: ['JWT_SECRET_KEY', 'OPENAI_API_KEY', 'LLAMAPARSE_API_KEY', 'PINECONE_API_KEY']
    args:
      - '-c'
      - |
        echo "🚀 Deploying candidate revision to production (no traffic)..."

        gcloud run deploy ${_SERVICE_NAME} \
          --image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --memory=${_MEMORY} \
          --cpu=${_CPU} \
          --concurrency=${_CONCURRENCY} \
          --max-instances=${_MAX_INSTANCES} \
          --timeout=60 \
          --port=8080 \
          --service-account=${_SERVICE_ACCOUNT} \
          --no-traffic \
          --tag=candidate-$SHORT_SHA \
          --set-env-vars="ENVIRONMENT=${_ENVIRONMENT},FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_DATABASE_ID=${_FIREBASE_DATABASE_ID},GCP_PROJECT_ID=$PROJECT_ID,LOG_LEVEL=${_LOG_LEVEL},LOG_FORMAT=json,GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},FRONTEND_DOMAIN=${_FRONTEND_DOMAIN},PRODUCTION_CORS_ORIGINS=${_PRODUCTION_CORS_ORIGINS},OPENAI_MODEL=${_OPENAI_MODEL},PINECONE_ENVIRONMENT=${_PINECONE_ENVIRONMENT},PINECONE_INDEX_NAME=${_PINECONE_INDEX_NAME},MAX_FILE_SIZE=${_MAX_FILE_SIZE},ALLOWED_FILE_TYPES=${_ALLOWED_FILE_TYPES}" \
          --update-secrets=JWT_SECRET_KEY=JWT_SECRET_KEY-prod:latest,OPENAI_API_KEY=OPENAI_API_KEY-prod:latest,LLAMAPARSE_API_KEY=LLAMAPARSE_API_KEY-prod:latest,PINECONE_API_KEY=PINECONE_API_KEY-prod:latest

        echo "✅ Candidate revision deployed (no traffic)"
    waitFor: ['push-production-image']

  # Step 5: Run smoke tests on candidate revision
  - name: 'gcr.io/cloud-builders/curl'
    id: 'smoke-test-candidate'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🧪 Running smoke tests on candidate revision..."

        # Get candidate revision URL
        CANDIDATE_URL="https://candidate-$SHORT_SHA---${_SERVICE_NAME}-$(echo $_REGION | tr -d '-')-$(gcloud config get-value project).a.run.app"
        echo "Candidate URL: $CANDIDATE_URL"

        # Wait for revision to be fully deployed
        echo "Waiting 15 seconds for candidate revision to initialize..."
        sleep 15

        # Test health endpoint
        echo "Testing /health endpoint..."
        curl -f -s "$CANDIDATE_URL/health" | python3 -m json.tool || exit 1

        # Test status endpoint
        echo "Testing /status endpoint..."
        curl -f -s "$CANDIDATE_URL/status" | python3 -m json.tool || exit 1

        echo "✅ Smoke tests passed on candidate revision!"
    waitFor: ['deploy-candidate-revision']

  # Step 6: Gradual rollout - 10% traffic
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'rollout-10-percent'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "📊 Phase 1: Routing 10% traffic to new revision..."

        # Get latest and previous revisions
        LATEST_REVISION=$(gcloud run revisions list --service=${_SERVICE_NAME} --region=${_REGION} --format="value(metadata.name)" --limit=1)
        PREVIOUS_REVISION=$(gcloud run revisions list --service=${_SERVICE_NAME} --region=${_REGION} --format="value(metadata.name)" --limit=2 | tail -1)

        echo "Latest revision: $LATEST_REVISION"
        echo "Previous revision: $PREVIOUS_REVISION"

        if [ "$LATEST_REVISION" != "$PREVIOUS_REVISION" ]; then
          gcloud run services update-traffic ${_SERVICE_NAME} \
            --region=${_REGION} \
            --to-revisions=$LATEST_REVISION=10,$PREVIOUS_REVISION=90

          echo "✅ 10% traffic now on new revision"
          echo "⏱️ Monitoring for 2 minutes..."
          sleep 120
        else
          echo "⚠️ Only one revision exists, skipping gradual rollout"
        fi
    waitFor: ['smoke-test-candidate']

  # Step 7: Increase to 50% traffic
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'rollout-50-percent'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "📊 Phase 2: Routing 50% traffic to new revision..."

        LATEST_REVISION=$(gcloud run revisions list --service=${_SERVICE_NAME} --region=${_REGION} --format="value(metadata.name)" --limit=1)
        PREVIOUS_REVISION=$(gcloud run revisions list --service=${_SERVICE_NAME} --region=${_REGION} --format="value(metadata.name)" --limit=2 | tail -1)

        if [ "$LATEST_REVISION" != "$PREVIOUS_REVISION" ]; then
          gcloud run services update-traffic ${_SERVICE_NAME} \
            --region=${_REGION} \
            --to-revisions=$LATEST_REVISION=50,$PREVIOUS_REVISION=50

          echo "✅ 50% traffic now on new revision"
          echo "⏱️ Monitoring for 2 minutes..."
          sleep 120
        else
          echo "⚠️ Skipping gradual rollout"
        fi
    waitFor: ['rollout-10-percent']

  # Step 8: Full rollout - 100% traffic
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'rollout-100-percent'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "📊 Phase 3: Routing 100% traffic to new revision..."

        LATEST_REVISION=$(gcloud run revisions list --service=${_SERVICE_NAME} --region=${_REGION} --format="value(metadata.name)" --limit=1)

        gcloud run services update-traffic ${_SERVICE_NAME} \
          --region=${_REGION} \
          --to-latest

        echo "✅ Full rollout complete! 100% traffic on new revision."
        echo ""
        echo "🎉 Production deployment successful!"
        echo ""
        echo "📊 Revision: $LATEST_REVISION"
        echo "🔗 Service URL: $(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')"
    waitFor: ['rollout-50-percent']

  # Step 9: Final health verification
  - name: 'gcr.io/cloud-builders/curl'
    id: 'final-health-check'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🏥 Running final health verification..."

        SERVICE_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format="value(status.url)")

        echo "Testing production service..."
        curl -f -s "$SERVICE_URL/health" | python3 -m json.tool || exit 1

        echo "✅ Production health check passed!"
        echo ""
        echo "🚀 Deployment pipeline complete!"
    waitFor: ['rollout-100-percent']

# Production substitutions
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'document-intelligence-api'
  _ENVIRONMENT: 'production'
  _FIREBASE_PROJECT_ID: 'biz2bricks-dev-v1'
  _FIREBASE_DATABASE_ID: 'biz2bricks-dev-v1-docdb-v1'
  _GCS_BUCKET_NAME: 'biz2bricks-dev-v1-document-store'
  _FRONTEND_DOMAIN: 'biztobricks.com'
  _PRODUCTION_CORS_ORIGINS: '["https://biztobricks.com","https://www.biztobricks.com"]'
  _SERVICE_ACCOUNT: '727735128283-compute@developer.gserviceaccount.com'
  _LOG_LEVEL: 'INFO'
  _MEMORY: '1Gi'
  _CPU: '1'
  _CONCURRENCY: '80'
  _MAX_INSTANCES: '10'
  _OPENAI_MODEL: 'gpt-4o-mini'
  _PINECONE_ENVIRONMENT: 'your-pinecone-env'
  _PINECONE_INDEX_NAME: 'document-intelligence'
  _MAX_FILE_SIZE: '52428800'
  _ALLOWED_FILE_TYPES: '["pdf", "xlsx", "xls", "csv"]'

# Store production images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_ENVIRONMENT}-latest'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:production-$SHORT_SHA'

# Tags for build organization
tags:
  - 'biz2bricks-prod-api'
  - 'master-branch'
  - 'automated-cicd'
  - 'production-environment'
  - 'gradual-rollout'
  - 'requires-approval'
