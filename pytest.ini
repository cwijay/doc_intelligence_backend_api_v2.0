[pytest]
# Pytest configuration for Document Intelligence API tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto

# Test output configuration
addopts =
    # Show verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Show captured output for failed tests
    --tb=short
    # Color output
    --color=yes
    # Show test durations (slowest 10)
    --durations=10
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Warnings
    -W ignore::DeprecationWarning
    # Coverage (commented out by default, uncomment to enable)
    # --cov=app
    # --cov-report=html
    # --cov-report=term-missing
    # --cov-fail-under=80

# Test markers
markers =
    smoke: Marks critical smoke tests for fast deployment validation (15-25 seconds total)
    slow: Marks tests as slow (deselect with '-m "not slow"')
    ai: Marks tests that use AI services and cost money (deselect with '-m "not ai"')
    integration: Marks tests as integration tests requiring full system
    unit: Marks tests as unit tests (isolated, fast)
    auth: Marks authentication-related tests
    document: Marks document-related tests
    org: Marks organization-related tests
    user: Marks user-related tests
    folder: Marks folder-related tests
    upload: Marks upload-related tests
    download: Marks download-related tests
    processing: Marks document processing tests (LlamaParse)
    sync: Marks sync validation tests
    cloud_run: Marks tests specific to Cloud Run deployment

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

# Console output configuration
console_output_style = progress

# Logging configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout configuration (requires pytest-timeout)
timeout = 300
timeout_method = thread

# Ignore patterns
norecursedirs = .git .venv venv env __pycache__ .pytest_cache .mypy_cache

# Coverage configuration (when enabled)
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */.venv/*
    */migrations/*
    */alembic/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = htmlcov
