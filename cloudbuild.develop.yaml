# ===========================================
# Cloud Build Configuration - Develop Branch
# Automatic deployment to development environment
# ===========================================
#
# Triggered by: Push to 'develop' branch
# Deploys to: document-intelligence-api-dev
# Timeline: ~5-7 minutes
#
# Pipeline Steps:
# 1. Run automated tests (pytest)
# 2. Build Docker image
# 3. Push to Google Container Registry
# 4. Deploy to Cloud Run (development)
# 5. Run health checks
#

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'

timeout: '1800s'

# Load secrets from Secret Manager (development secrets)
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/JWT_SECRET_KEY/versions/latest
      env: JWT_SECRET_KEY
    - versionName: projects/$PROJECT_ID/secrets/OPENAI_API_KEY/versions/latest
      env: OPENAI_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/LLAMAPARSE_API_KEY/versions/latest
      env: LLAMAPARSE_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/PINECONE_API_KEY/versions/latest
      env: PINECONE_API_KEY

steps:
  # Step 1: Run automated tests
  - name: 'python:3.12-slim'
    id: 'run-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🧪 Running automated tests..."
        echo "Installing UV package manager..."
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="/root/.cargo/bin:$PATH"

        echo "Installing dependencies..."
        uv sync --frozen

        echo "Running smoke tests (fast validation)..."
        uv run pytest tests/ -v -m "smoke" --asyncio-mode=auto --tb=short || exit 1

        echo "✅ Smoke tests passed!"

  # Step 2: Build Docker image for Cloud Run
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_ENVIRONMENT}-latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_ENVIRONMENT}-$SHORT_SHA'
      - '.'
    waitFor: ['run-tests']

  # Step 3: Push all image tags to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}'
    waitFor: ['build-image']

  # Step 4: Deploy to Cloud Run (development environment)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-to-cloudrun'
    entrypoint: 'bash'
    secretEnv: ['JWT_SECRET_KEY', 'OPENAI_API_KEY', 'LLAMAPARSE_API_KEY', 'PINECONE_API_KEY']
    args:
      - '-c'
      - |
        echo "🚀 Deploying to Cloud Run (development)..."

        gcloud run deploy ${_SERVICE_NAME} \
          --image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --memory=${_MEMORY} \
          --cpu=${_CPU} \
          --concurrency=${_CONCURRENCY} \
          --max-instances=${_MAX_INSTANCES} \
          --timeout=60 \
          --port=8080 \
          --service-account=${_SERVICE_ACCOUNT} \
          --set-env-vars="ENVIRONMENT=${_ENVIRONMENT},FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_DATABASE_ID=${_FIREBASE_DATABASE_ID},GCP_PROJECT_ID=$PROJECT_ID,LOG_LEVEL=${_LOG_LEVEL},LOG_FORMAT=json,GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},FRONTEND_DOMAIN=${_FRONTEND_DOMAIN},PRODUCTION_CORS_ORIGINS=${_PRODUCTION_CORS_ORIGINS},OPENAI_MODEL=${_OPENAI_MODEL},PINECONE_ENVIRONMENT=${_PINECONE_ENVIRONMENT},PINECONE_INDEX_NAME=${_PINECONE_INDEX_NAME},MAX_FILE_SIZE=${_MAX_FILE_SIZE},ALLOWED_FILE_TYPES=${_ALLOWED_FILE_TYPES}" \
          --update-secrets=JWT_SECRET_KEY=JWT_SECRET_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,LLAMAPARSE_API_KEY=LLAMAPARSE_API_KEY:latest,PINECONE_API_KEY=PINECONE_API_KEY:latest

        echo "✅ Deployment successful!"
    waitFor: ['push-image']

  # Step 5: Run health checks
  - name: 'gcr.io/cloud-builders/curl'
    id: 'health-check'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🏥 Running health checks..."

        # Get service URL
        SERVICE_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format="value(status.url)")
        echo "Service URL: $SERVICE_URL"

        # Wait for service to be ready
        echo "Waiting 15 seconds for service to initialize..."
        sleep 15

        # Test health endpoint
        echo "Testing /health endpoint..."
        curl -f -s "$SERVICE_URL/health" | python3 -m json.tool || exit 1

        # Test status endpoint
        echo "Testing /status endpoint..."
        curl -f -s "$SERVICE_URL/status" | python3 -m json.tool || exit 1

        echo "✅ Health checks passed!"
        echo ""
        echo "🎉 Development deployment complete!"
        echo "Service URL: $SERVICE_URL"
    waitFor: ['deploy-to-cloudrun']

# Substitution variables for develop environment
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'document-intelligence-api-dev'
  _ENVIRONMENT: 'development'
  _FIREBASE_PROJECT_ID: 'biz2bricks-dev-v1'
  _FIREBASE_DATABASE_ID: 'biz2bricks-dev-v1-docdb-v1'
  _GCS_BUCKET_NAME: 'biz2bricks-dev-v1-document-store'
  _FRONTEND_DOMAIN: 'dev.biztobricks.com'
  _PRODUCTION_CORS_ORIGINS: '["https://dev.biztobricks.com","http://localhost:3000"]'
  _SERVICE_ACCOUNT: '727735128283-compute@developer.gserviceaccount.com'
  _LOG_LEVEL: 'DEBUG'
  _MEMORY: '1Gi'
  _CPU: '1'
  _CONCURRENCY: '80'
  _MAX_INSTANCES: '5'
  _OPENAI_MODEL: 'gpt-4o-mini'
  _PINECONE_ENVIRONMENT: 'your-pinecone-env'
  _PINECONE_INDEX_NAME: 'document-intelligence-dev'
  _MAX_FILE_SIZE: '52428800'
  _ALLOWED_FILE_TYPES: '["pdf", "xlsx", "xls", "csv"]'

# Store built images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_ENVIRONMENT}-latest'

# Tags for build organization
tags:
  - 'biz2bricks-dev-api'
  - 'develop-branch'
  - 'automated-cicd'
  - 'development-environment'
